MaintainerNotes: |-
  Upstream listing text and screenshots are in fastlane/metadata/android/en-US.
  Release preparation generates a build entry pinned to its exact source commit.
  The Gradle properties file owns versionName/versionCode.
  Build requirements: JDK 17, Platform 37.0, Build Tools 36.0.0, Gradle 9.6.0.
  APK output is unsigned; no signing configuration or Google services are needed.
  Upstream developer-signature reuse requires independent reproducible-build
  verification and a real AllowedAPKSigningKeys fingerprint before submission.
